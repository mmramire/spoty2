version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"

    open-pull-requests-limit: 2

    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    labels:
      - "dependencies"
      - "dependabot"
